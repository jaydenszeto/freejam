name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build extension
        working-directory: extension
        env:
          FREEJAM_SERVER: wss://167-234-216-26.nip.io/ws
          FREEJAM_VERSION: ${{ github.ref_name }}
        run: |
          bun install
          bun run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/dist/freejam.js
          generate_release_notes: true
